<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Admin</title>
<style>
:root {
  --bg:        #1c1714;
  --surface:   #2d2622;
  --surface2:  #3a302a;
  --surface3:  #4a3f38;
  --accent:    #c49a2c;
  --accent-bg: rgba(196,154,44,0.12);
  --text:      #f5f1eb;
  --muted:     #9a8878;
  --ok:        #4caf50;
  --err:       #e05555;
  --border:    rgba(196,154,44,0.18);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
button{cursor:pointer;font-family:inherit}
input,textarea{font-family:inherit}

/* ── LOGIN ── */
#login{display:flex;align-items:center;justify-content:center;height:100vh}
.lcard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:48px 40px;width:340px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.llogo{font-size:26px;font-weight:700;color:var(--accent);margin-bottom:6px}
.lsub{color:var(--muted);font-size:13px;margin-bottom:32px}
.lcard input{width:100%;padding:11px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;margin-bottom:10px;outline:none;transition:border-color .2s}
.lcard input:focus{border-color:var(--accent)}
.btn-login{width:100%;padding:12px;background:var(--accent);color:#1c1714;border:none;border-radius:8px;font-size:14px;font-weight:600;transition:opacity .2s}
.btn-login:hover{opacity:.85}
.lerr{color:var(--err);font-size:12px;margin-top:8px;min-height:16px;text-align:center}

/* ── APP SHELL ── */
#app{display:flex;flex-direction:column;height:100vh}
#app[hidden]{display:none}
header{height:54px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;flex-shrink:0}
.hlogo{font-size:15px;font-weight:700;color:var(--accent)}
.hlogo span{color:var(--muted);font-weight:400;font-size:12px;margin-left:8px}
.btn-out{padding:6px 14px;background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--muted);font-size:12px;transition:all .2s}
.btn-out:hover{border-color:var(--err);color:var(--err)}

/* ── TABS ── */
.tabs{height:42px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;padding:0 20px;flex-shrink:0}
.tab{padding:0 18px;background:transparent;border:none;border-bottom:2px solid transparent;color:var(--muted);font-size:13px;margin-bottom:-1px;transition:all .2s}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab:hover:not(.on){color:var(--text)}

/* ── IMAGE TAB ── */
#t-img{display:grid;grid-template-columns:230px 1fr;flex:1;overflow:hidden}
#t-img[hidden]{display:none}

/* ── SIDEBAR ── */
aside{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sh{padding:14px 14px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.sh-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.btn-nf{padding:4px 10px;background:var(--accent-bg);border:1px solid var(--accent);border-radius:6px;color:var(--accent);font-size:11px;transition:all .2s}
.btn-nf:hover{background:var(--accent);color:#1c1714}
#flist{flex:1;overflow-y:auto;padding:6px}
.fi{padding:8px 10px;border-radius:7px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:7px;color:var(--muted);transition:all .15s;user-select:none}
.fi:hover{background:var(--surface2);color:var(--text)}
.fi.on{background:var(--accent-bg);color:var(--accent)}
.fi .cnt{margin-left:auto;font-size:10px;background:var(--surface3);padding:2px 5px;border-radius:8px}
.fi.sub{padding-left:26px}

/* ── CONTENT ── */
.ca{display:flex;flex-direction:column;overflow:hidden}
.ch{height:48px;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 18px;gap:6px;flex-shrink:0}
.bc{font-size:13px;color:var(--muted)}
.bc .cur{color:var(--text);font-weight:500}

/* ── DROPZONE ── */
#dz{margin:14px 16px 10px;border:2px dashed var(--border);border-radius:10px;padding:24px 16px;text-align:center;cursor:pointer;transition:all .2s;flex-shrink:0}
#dz:hover,#dz.over{border-color:var(--accent);background:var(--accent-bg)}
.dzi{font-size:28px;margin-bottom:6px;opacity:.5}
.dzt{font-size:13px;color:var(--text);margin-bottom:3px}
.dzs{font-size:11px;color:var(--muted)}
#fi{display:none}

/* ── GRID ── */
.gw{flex:1;overflow-y:auto;padding:0 16px 16px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.ic{position:relative;aspect-ratio:1;border-radius:7px;overflow:hidden;background:var(--surface2);border:1px solid var(--border)}
.ic img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s}
.ic:hover img{transform:scale(1.04)}
.iov{position:absolute;inset:0;background:rgba(0,0,0,0);transition:background .2s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.ic:hover .iov{background:rgba(0,0,0,.65)}
.ab{padding:5px 12px;border:none;border-radius:5px;font-size:11px;font-weight:500;cursor:pointer;opacity:0;transform:translateY(5px);transition:all .2s}
.ic:hover .ab{opacity:1;transform:translateY(0)}
.ab.cp{background:var(--accent);color:#1c1714}
.ab.dl{background:var(--err);color:#fff}
.iname{position:absolute;bottom:0;left:0;right:0;padding:3px 5px;font-size:10px;background:rgba(0,0,0,.7);color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic.upl{display:flex;align-items:center;justify-content:center}
.spin{width:24px;height:24px;border:3px solid var(--surface3);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ic.sub-dir{cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--surface3)}
.ic.sub-dir span{font-size:11px;color:var(--muted)}

/* ── DATA TAB ── */
#t-data{display:none;flex-direction:column;flex:1;padding:18px;gap:12px;overflow:hidden}
.dtbar{display:flex;align-items:center;justify-content:space-between}
.dtbar h2{font-size:14px;font-weight:600}
.dts{font-size:12px;color:var(--muted);margin-top:2px}
.btn-sv{padding:8px 22px;background:var(--accent);color:#1c1714;border:none;border-radius:7px;font-size:13px;font-weight:600;transition:opacity .2s}
.btn-sv:hover{opacity:.85}
#dta{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px;color:var(--text);font-family:'Courier New',monospace;font-size:12px;line-height:1.6;resize:none;outline:none;overflow-y:auto}
#dta:focus{border-color:var(--accent)}

/* ── MODAL ── */
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:100}
.mbg[hidden]{display:none}
.mo{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:26px;width:340px}
.mo h3{font-size:15px;margin-bottom:14px}
.mo input{width:100%;padding:9px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:13px;outline:none;margin-bottom:6px}
.mo input:focus{border-color:var(--accent)}
.mhint{font-size:11px;color:var(--muted);margin-bottom:14px}
.mact{display:flex;gap:8px;justify-content:flex-end}
.btn-cc{padding:8px 18px;background:transparent;border:1px solid var(--border);border-radius:7px;color:var(--muted);font-size:13px;transition:all .2s}
.btn-cc:hover{border-color:var(--text);color:var(--text)}
.btn-ok{padding:8px 18px;background:var(--accent);color:#1c1714;border:none;border-radius:7px;font-size:13px;font-weight:600}

/* ── TOASTS ── */
#tst{position:fixed;top:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:7px}
.t{padding:11px 18px;border-radius:8px;font-size:13px;max-width:320px;box-shadow:0 4px 20px rgba(0,0,0,.4);animation:tin .2s ease}
.t.ok{background:var(--ok);color:#fff}
.t.er{background:var(--err);color:#fff}
.t.if{background:var(--surface3);color:var(--text);border:1px solid var(--border)}
@keyframes tin{from{transform:translateX(16px);opacity:0}}

/* ── EMPTY ── */
.emp{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:40px;color:var(--muted);font-size:13px;grid-column:1/-1}
.emp .ei{font-size:28px;opacity:.4}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:3px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="lcard">
    <div class="llogo">CW Admin</div>
    <div class="lsub">Portfolio Management</div>
    <input type="text" id="u" placeholder="아이디 (admin)" autocomplete="username">
    <input type="password" id="p" placeholder="비밀번호" autocomplete="current-password"
           onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn-login" onclick="doLogin()">로그인</button>
    <div id="lerr" class="lerr"></div>
  </div>
</div>

<!-- ADMIN -->
<div id="app" hidden>
  <header>
    <div class="hlogo">CW Admin <span>Portfolio Manager</span></div>
    <button class="btn-out" onclick="doLogout()">로그아웃</button>
  </header>

  <div class="tabs">
    <button class="tab on" onclick="switchTab('img',this)">🖼 이미지 관리</button>
    <button class="tab" onclick="switchTab('data',this)">📄 데이터 편집</button>
  </div>

  <!-- IMAGE TAB -->
  <div id="t-img">
    <aside>
      <div class="sh">
        <span class="sh-label">프로젝트 폴더</span>
        <button class="btn-nf" onclick="openModal()">+ 새 폴더</button>
      </div>
      <div id="flist"><div class="emp"><div class="ei">📂</div>로딩 중...</div></div>
    </aside>

    <div class="ca">
      <div class="ch">
        <span class="bc">images/projects/<span class="cur" id="cfname">폴더를 선택하세요</span></span>
      </div>

      <div id="dz" onclick="document.getElementById('fi').click()">
        <div class="dzi">☁️</div>
        <div class="dzt">드래그 앤 드롭 또는 클릭하여 업로드</div>
        <div class="dzs">PNG · JPG · WebP · GIF &nbsp;|&nbsp; 최대 7MB</div>
        <input type="file" id="fi" multiple accept="image/*" onchange="onFileSelect(event)">
      </div>

      <div class="gw">
        <div id="grid">
          <div class="emp"><div class="ei">👈</div>왼쪽 폴더를 선택하세요</div>
        </div>
      </div>
    </div>
  </div>

  <!-- DATA TAB -->
  <div id="t-data">
    <div class="dtbar">
      <div>
        <h2>data.json 편집</h2>
        <div class="dts" id="dts">변경사항 없음</div>
      </div>
      <button class="btn-sv" onclick="saveData()">저장 → GitHub</button>
    </div>
    <textarea id="dta" spellcheck="false"
              oninput="document.getElementById('dts').textContent='저장되지 않은 변경사항 있음'"></textarea>
  </div>
</div>

<!-- NEW FOLDER MODAL -->
<div id="modal" class="mbg" hidden>
  <div class="mo">
    <h3>새 폴더 만들기</h3>
    <input type="text" id="fn" placeholder="폴더 이름 (예: myproject)"
           onkeydown="if(event.key==='Enter')confirmFolder()">
    <div class="mhint">영문, 숫자, -, _, / 사용 가능 &nbsp;|&nbsp; 예: subdir/project</div>
    <div class="mact">
      <button class="btn-cc" onclick="closeModal()">취소</button>
      <button class="btn-ok" onclick="confirmFolder()">만들기</button>
    </div>
  </div>
</div>

<div id="tst"></div>

<script>
const TK = 'cw_admin_tk';
let curFolder = null;
let dataSha = null;

// ── AUTH ──
async function doLogin() {
  const pw = document.getElementById('p').value;
  document.getElementById('lerr').textContent = '';
  if (!pw) { document.getElementById('lerr').textContent = '비밀번호를 입력해주세요'; return; }
  try {
    const r = await req('POST', '/api/auth', { password: pw });
    localStorage.setItem(TK, r.token);
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').hidden = false;
    loadFolders();
  } catch (e) {
    document.getElementById('lerr').textContent = e.message;
  }
}

function doLogout() {
  localStorage.removeItem(TK);
  document.getElementById('app').hidden = true;
  document.getElementById('login').style.display = 'flex';
  document.getElementById('p').value = '';
}

// ── API ──
async function req(method, url, body = null) {
  const tk = localStorage.getItem(TK);
  const opts = {
    method,
    headers: { 'Content-Type': 'application/json', ...(tk ? { Authorization: `Bearer ${tk}` } : {}) }
  };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(url, opts);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

// ── FOLDERS ──
async function loadFolders() {
  const el = document.getElementById('flist');
  el.innerHTML = '<div class="emp"><div class="ei">⏳</div>로딩 중...</div>';
  try {
    const folders = await req('GET', '/api/folders');
    el.innerHTML = folders.length
      ? folders.map(f =>
          `<div class="fi" onclick="selectFolder('${f.path}',this)">
            <span>📁</span><span>${f.name}</span>
           </div>`
        ).join('')
      : '<div class="emp"><div class="ei">📭</div>폴더 없음</div>';
  } catch (e) {
    el.innerHTML = `<div class="emp"><div class="ei">⚠️</div>${e.message}</div>`;
  }
}

async function selectFolder(path, el) {
  curFolder = path;
  document.querySelectorAll('.fi').forEach(i => i.classList.remove('on'));
  el?.classList.add('on');
  document.getElementById('cfname').textContent = path;
  await loadImages(path);
}

// ── IMAGES ──
async function loadImages(folder) {
  const g = document.getElementById('grid');
  g.innerHTML = '<div class="emp"><div class="spin"></div></div>';
  try {
    const { folders, images } = await req('GET', `/api/images?folder=${encodeURIComponent(folder)}`);
    renderImages(folders, images, folder);
  } catch (e) {
    g.innerHTML = `<div class="emp"><div class="ei">⚠️</div>${e.message}</div>`;
  }
}

function renderImages(subs, imgs, folder) {
  const g = document.getElementById('grid');
  g.innerHTML = '';
  subs.forEach(f => {
    const c = document.createElement('div');
    c.className = 'ic sub-dir';
    c.innerHTML = `<span style="font-size:28px">📁</span><span>${f.name}</span>`;
    c.onclick = () => {
      document.querySelectorAll('.fi').forEach(i => i.classList.remove('on'));
      curFolder = f.path;
      document.getElementById('cfname').textContent = f.path;
      loadImages(f.path);
    };
    g.appendChild(c);
  });
  imgs.forEach(img => appendImageCard(img, folder));
  if (!subs.length && !imgs.length) {
    g.innerHTML = '<div class="emp"><div class="ei">🖼</div>이미지 없음 · 위에서 업로드하세요</div>';
  }
}

function appendImageCard(img, folder) {
  const g = document.getElementById('grid');
  const empty = g.querySelector('.emp');
  if (empty) empty.remove();
  const c = document.createElement('div');
  c.className = 'ic';
  c.dataset.sha = img.sha;
  c.innerHTML = `
    <img src="${img.url}" loading="lazy" alt="${img.name}">
    <div class="iov">
      <button class="ab cp" onclick="copyPath('${img.path}',event)">경로 복사</button>
      <button class="ab dl" onclick="delImg('${folder}','${img.name}','${img.sha}',this.closest('.ic'),event)">삭제</button>
    </div>
    <div class="iname">${img.name}</div>`;
  g.appendChild(c);
}

function copyPath(path, e) {
  e.stopPropagation();
  navigator.clipboard.writeText(path).then(() => toast(`복사됨: ${path}`, 'if'));
}

async function delImg(folder, name, sha, card, e) {
  e.stopPropagation();
  if (!confirm(`"${name}" 을 삭제할까요?\nGitHub에서 영구 삭제됩니다.`)) return;
  try {
    await req('DELETE', `/api/images?folder=${encodeURIComponent(folder)}`, { filename: name, sha });
    card.remove();
    toast(`${name} 삭제됨`, 'ok');
    const g = document.getElementById('grid');
    if (!g.children.length) {
      g.innerHTML = '<div class="emp"><div class="ei">🖼</div>이미지 없음</div>';
    }
  } catch (e) {
    toast('삭제 실패: ' + e.message, 'er');
  }
}

// ── UPLOAD ──
const dz = document.getElementById('dz');
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('over'); });
dz.addEventListener('dragleave', () => dz.classList.remove('over'));
dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('over'); handleFiles([...e.dataTransfer.files]); });
function onFileSelect(e) { handleFiles([...e.target.files]); e.target.value = ''; }

async function handleFiles(files) {
  if (!curFolder) { toast('먼저 폴더를 선택하세요', 'er'); return; }
  const imgs = files.filter(f => f.type.startsWith('image/'));
  if (!imgs.length) { toast('이미지 파일만 업로드 가능합니다', 'er'); return; }
  for (const f of imgs) {
    if (f.size > 7 * 1024 * 1024) {
      toast(`${f.name}: 7MB 초과 (${(f.size/1024/1024).toFixed(1)}MB)`, 'er');
      continue;
    }
    await uploadOne(f);
  }
}

async function uploadOne(file) {
  const g = document.getElementById('grid');
  const empty = g.querySelector('.emp');
  if (empty) empty.remove();

  const card = document.createElement('div');
  card.className = 'ic upl';
  card.innerHTML = `<div style="text-align:center"><div class="spin" style="margin:0 auto 7px"></div><div style="font-size:10px;color:var(--muted)">${file.name}</div></div>`;
  g.appendChild(card);

  try {
    const content = await toB64(file);
    const r = await req('POST', '/api/upload', { folder: curFolder, filename: file.name, content });
    card.remove();
    appendImageCard({ name: file.name, sha: r.sha || '', url: URL.createObjectURL(file), path: r.path }, curFolder);
    toast(`${file.name} 업로드 완료 · Vercel 배포 중`, 'ok');
  } catch (e) {
    card.remove();
    toast(`${file.name} 실패: ${e.message}`, 'er');
  }
}

function toB64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

// ── NEW FOLDER ──
function openModal()  { document.getElementById('modal').hidden = false; document.getElementById('fn').value = ''; setTimeout(() => document.getElementById('fn').focus(), 50); }
function closeModal() { document.getElementById('modal').hidden = true; }

async function confirmFolder() {
  const name = document.getElementById('fn').value.trim();
  if (!name) return;
  if (!/^[a-zA-Z0-9/_-]+$/.test(name)) { toast('영문, 숫자, -, _, / 만 사용 가능합니다', 'er'); return; }
  try {
    await req('POST', '/api/folders', { name });
    closeModal();
    toast(`폴더 "${name}" 생성됨 · Vercel 배포 중`, 'ok');
    await loadFolders();
  } catch (e) {
    toast('폴더 생성 실패: ' + e.message, 'er');
  }
}

// ── DATA ──
async function loadData() {
  document.getElementById('dta').value = '로딩 중...';
  try {
    const { content, sha } = await req('GET', '/api/data');
    dataSha = sha;
    document.getElementById('dta').value = JSON.stringify(content, null, 2);
    document.getElementById('dts').textContent = '변경사항 없음';
  } catch (e) {
    document.getElementById('dta').value = '';
    toast('data.json 로드 실패: ' + e.message, 'er');
  }
}

async function saveData() {
  const raw = document.getElementById('dta').value;
  let content;
  try { content = JSON.parse(raw); } catch { toast('JSON 형식 오류', 'er'); return; }
  if (!dataSha) { toast('먼저 데이터를 로드해주세요', 'er'); return; }
  try {
    await req('POST', '/api/data', { content, sha: dataSha });
    toast('data.json 저장됨 · Vercel 자동 배포 시작 (1~3분)', 'ok');
    document.getElementById('dts').textContent = '저장됨 · 배포 중...';
    const { sha } = await req('GET', '/api/data');
    dataSha = sha;
  } catch (e) {
    toast('저장 실패: ' + e.message, 'er');
  }
}

// ── TABS ──
function switchTab(tab, btn) {
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  document.getElementById('t-img').style.display  = tab === 'img'  ? 'grid' : 'none';
  document.getElementById('t-data').style.display = tab === 'data' ? 'flex' : 'none';
  if (tab === 'data' && !dataSha) loadData();
}

// ── TOAST ──
function toast(msg, type = 'ok') {
  const el = document.createElement('div');
  el.className = `t ${type}`;
  el.textContent = msg;
  document.getElementById('tst').appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 3500);
}

// ── STARTUP ──
(async () => {
  const tk = localStorage.getItem(TK);
  if (tk) {
    try {
      const { valid } = await req('GET', '/api/auth');
      if (valid) {
        document.getElementById('login').style.display = 'none';
        document.getElementById('app').hidden = false;
        loadFolders();
        return;
      }
    } catch {}
  }
  localStorage.removeItem(TK);
})();
</script>
